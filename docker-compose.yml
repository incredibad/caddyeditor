services:
  caddyeditor:
    image: incredibad/caddyeditor:latest
    # host networking lets the container reach Caddy's admin API on localhost:2019
    # directly. The app is then available on port 7285 of the host itself.
    network_mode: host
    volumes:
      # Change the left side to your actual Caddyfile path on the host
      - /etc/caddy/Caddyfile:/data/Caddyfile
    environment:
      # Path to the Caddyfile inside the container (matches the volume target above)
      - CADDYFILE_PATH=/data/Caddyfile

      # Caddy's admin API — localhost works because of network_mode: host
      - CADDY_ADMIN_URL=http://localhost:2019

      # Set a long random secret (e.g. openssl rand -hex 32)
      - SECRET_KEY=changeme-please-set-a-secure-secret-key

      # Optional login — set PASSWORD to enable authentication, leave blank to disable
      - USERNAME=admin
      - PASSWORD=
    restart: unless-stopped

services:
  caddyeditor:
    image: incredibad/caddyeditor:latest  # use :dev for the dev build
    container_name: caddyeditor
    ports:
      - "7285:7285"                        # host:container — access the UI at http://<server>:7285
    volumes:
      - /etc/caddy/Caddyfile:/data/Caddyfile  # left = path on host, right = path inside container (don't change right side)
      - caddyeditor_data:/data/app             # persists app state (TOTP secret, etc.)
      - /var/run/docker.sock:/var/run/docker.sock:ro  # read-only Docker socket for fetching Caddy logs
    environment:
      - CADDYFILE_PATH=/data/Caddyfile         # must match the right side of the volume mount above
      - CADDY_ADMIN_URL=http://caddy:2019      # Caddy container name + admin port; requires admin 0.0.0.0:2019 in your Caddyfile global block
      - CADDY_VERSION=latest                   # version to use for caddy fmt — set to match your running Caddy (e.g. 2.9.1)
                                               # docker: docker exec caddy caddy version
                                               # native: caddy version
      - SECRET_KEY=changeme-please-set-a-secure-secret-key  # run: openssl rand -hex 32
      - USERNAME=admin                          # login username (only used if PASSWORD is set)
      - PASSWORD=                               # leave blank to disable auth, set to enable the login page
      - CADDY_CONTAINER=caddy                   # name of the Caddy container to fetch logs from
    networks:
      - proxy  # must be the same Docker network as your Caddy container
    restart: unless-stopped

networks:
  proxy:
    external: true  # this network is managed externally (by Caddy's docker-compose), not created here

volumes:
  caddyeditor_data:  # managed by Docker, persists across container recreations

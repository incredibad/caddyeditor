services:
  caddyeditor:
    image: incredibad/caddyeditor:latest
    ports:
      - "7285:7285"
    volumes:
      # Change the left side to your actual Caddyfile path on the host
      - /etc/caddy/Caddyfile:/data/Caddyfile
    environment:
      # Path to the Caddyfile inside the container (matches the volume target above)
      - CADDYFILE_PATH=/data/Caddyfile

      # URL of Caddy's admin API, reachable from inside the container.
      # host.docker.internal resolves to your host via the extra_hosts entry below.
      # If Caddy's admin port is not 2019, change it here.
      - CADDY_ADMIN_URL=http://host.docker.internal:2019

      # Set a long random secret (e.g. openssl rand -hex 32)
      - SECRET_KEY=changeme-please-set-a-secure-secret-key

      # Optional login — set PASSWORD to enable authentication, leave blank to disable
      - USERNAME=admin
      - PASSWORD=
    extra_hosts:
      # Allows host.docker.internal to reach the Docker host on Linux
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
